name: WortUniversum
description: An orthography and grammar learning app, from primary/elementary school kids onwards
publish_to: 'none'
version: 1.0.3

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # UI & Animations
  cupertino_icons: ^1.0.6
  lottie: ^3.1.0
  # rive: ^0.12.4
  animated_text_kit: ^4.2.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_cube: ^0.1.1
  image: ^4.1.3
  
  # Audio
  audioplayers: ^5.2.1
  flutter_tts: ^3.8.5
  
  # Storage & Data
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.1.0
  csv: ^5.0.2
  http: ^1.2.1
  sqlite3: ^2.1.0
  sqflite_common_ffi_web: ^0.4.0
  archive: ^3.6.1

  # Development
  flutter_launcher_icons: ^0.13.1

  in_app_purchase: ^3.1.13
  url_launcher: ^6.3.2

  path_provider: any
  in_app_purchase_storekit: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
flutter:
  uses-material-design: true
  generate: true # Enable i18n generation
  
  assets:
    - assets/images/
    - assets/fonts/
    - lib/features/games/data/ 
    - assets/fonts/OFL.txt
    - assets/grundwortschatz.db.gz
    #- assets/grundwortschatz.db
    
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    
    - family: Grundschrift
      fonts:
        - asset: assets/fonts/Grundschrift-Regular.otf
        - asset: assets/fonts/Grundschrift-Bold.otf
          weight: 700
        - asset: assets/fonts/Grundschrift-Light.otf
          weight: 300
        - asset: assets/fonts/Grundschrift-Kontur.otf
        - asset: assets/fonts/Grundschrift-Punkt.otf

    - family: SASBienchen
      fonts:
        - asset: assets/fonts/BienchenSASOpenType.ttf

    - family: BernerBasisschrift
      fonts:
        - asset: assets/fonts/BernerBasisschrift1.ttf
        - asset: assets/fonts/BernerBasisschrift2.ttf
          # You may need to add weight/style hints here if one is bold

    - family: DidactGothic
      fonts:
        - asset: assets/fonts/DidactGothic-Regular.otf
        # - asset: assets/fonts/DidactGothic-Regular.ttf # Duplicate, using .otf

    - family: EuroScript
      fonts:
        - asset: assets/fonts/EuroScript.ttf
        - asset: assets/fonts/EuroScriptBold.ttf
          weight: 700

    - family: Gruenewald
      fonts:
        - asset: assets/fonts/Gruenewald VA normal.ttf
        - asset: assets/fonts/Gruenewald VA 1K.ttf
        - asset: assets/fonts/Gruenewald VA 3K.ttf
          
    - family: LetsTrace
      fonts:
        - asset: assets/fonts/letstrace.s-trace-basic.otf
        - asset: assets/fonts/letstrace.s-trace-italic.otf
          style: italic
        - asset: assets/fonts/letstrace.s-trace-ruled.otf

    - family: SchulfibelNord
      fonts:
        - asset: assets/fonts/Schulfibel Nord Linie 2.ttf

    - family: Schulkursiv
      fonts:
        - asset: assets/fonts/Schulkursiv.ttf

    - family: SimplePrint
      fonts:
        - asset: assets/fonts/Simple Print.ttf
        - asset: assets/fonts/Simple Print_Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  macos: 
    generate: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    # Optional: You can specify a different icon for the web if you want
    # image_path: "assets/images/web_icon.png" 
    # Optional: Adds a background color for transparent icons
    background_color: "#0a0a2a"
    # Optional: Sets the theme color in the generated manifest
    theme_color: "#0a0a2a"
