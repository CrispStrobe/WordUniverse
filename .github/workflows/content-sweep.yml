name: Content sweep

# The per-push contract checks ten items per game per grade. The games can
# produce on the order of a hundred thousand distinct items, so ten of them
# holding is not yet a rule holding — three reading passes found twenty-one
# content bugs in a sample that size, which says the tail is long.
#
# This runs the same invariants over a far larger sample, sharded by grade so
# each job stays short, and only on a schedule: it is a net to catch what the
# per-push check is too small to see, not a gate on a commit.

on:
  schedule:
    # 04:20 UTC, after the day's pushes have settled.
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Items per game per grade'
        default: '500'
      seed:
        description: 'WU_CONTRACT_SEED, to reproduce a run (blank = run number)'
        required: false

concurrency:
  group: content-sweep
  # Not cancel-in-progress. For the per-push check superseding is right — only
  # the newest commit matters. This one exists to look at items nothing has
  # looked at yet, so cancelling a half-finished sweep throws away the single
  # thing it produces. A dispatch waits for the nightly instead of killing it.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    name: ${{ matrix.language }} grade ${{ matrix.grade }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # A free public repo runs twenty jobs at once. This workflow is fifteen
      # of them, so a sweep and a push together saturate the pool and the
      # push waits — twenty-five minutes, measured. The sweep has all night
      # and nothing waits on it; the push has somebody watching.
      max-parallel: 5
      matrix:
        language: [en, de]
        grade: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Read the German pack pin
        id: depack
        if: matrix.language == 'de'
        run: |
          python3 - <<'PIN' >> "$GITHUB_OUTPUT"
          import re, pathlib
          source = pathlib.Path('lib/core/models/language_pack.dart').read_text()
          url = re.search(r"remoteUrl:\s*\n?\s*'([^']+)'", source).group(1)
          sha = re.search(r"expectedCompressedSha256:\s*\n?\s*'([0-9a-f]+)'",
                          source).group(1)
          print(f'url={url}')
          print(f'sha={sha}')
          PIN

      - name: Cache the German pack
        id: depack-cache
        if: matrix.language == 'de'
        uses: actions/cache@v5
        with:
          path: .cache/packs/grundwortschatz.db
          key: de-pack-${{ steps.depack.outputs.sha }}

      - name: Fetch the German pack
        if: matrix.language == 'de' && steps.depack-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/packs
          curl -fsSL "${{ steps.depack.outputs.url }}" -o /tmp/de.db.gz
          echo "${{ steps.depack.outputs.sha }}  /tmp/de.db.gz" | sha256sum -c -
          gunzip -c /tmp/de.db.gz > .cache/packs/grundwortschatz.db

      # One language and one grade per job, so each stays inside the hour and
      # a failure names exactly where it lives.
      - name: Sweep
        env:
          WU_CONTRACT_COUNT: ${{ github.event.inputs.count || '500' }}
          # A different slice of the item space every night. The number is
          # printed with the result, so a red sweep is reproduced exactly by
          # re-running with WU_CONTRACT_SEED set to what it printed.
          WU_CONTRACT_SEED: ${{ github.event.inputs.seed || github.run_number }}
          WU_CONTRACT_GRADES: ${{ matrix.grade }}
          WU_CONTRACT_LANGUAGES: ${{ matrix.language }}
          WU_PACK_DE: ${{ matrix.language == 'de' && format('{0}/.cache/packs/grundwortschatz.db', github.workspace) || '' }}
        run: flutter test --reporter expanded test/audit/challenge_contract_test.dart

  # Games whose item space ends. Asked for more than the table holds, the
  # generator runs out and what comes back is every item the game can ever
  # produce: 62 false friends, 400 phrasal verbs. For these, "checked" and
  # "all of them checked" are the same sentence, so they do not need a sample
  # and do not need a seed.
  exhaustive:
    name: exhaustive ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: en
            games: false_friends,phrasal_verb_match,phrasal_verb_power,homophone_drill,antonym_flash
          - language: de
            games: wortfalle,verbtrenner,antonym_flash

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Read the German pack pin
        id: depack
        if: matrix.language == 'de'
        run: |
          python3 - <<'PIN' >> "$GITHUB_OUTPUT"
          import re, pathlib
          source = pathlib.Path('lib/core/models/language_pack.dart').read_text()
          url = re.search(r"remoteUrl:\s*\n?\s*'([^']+)'", source).group(1)
          sha = re.search(r"expectedCompressedSha256:\s*\n?\s*'([0-9a-f]+)'",
                          source).group(1)
          print(f'url={url}')
          print(f'sha={sha}')
          PIN

      - name: Cache the German pack
        id: depack-cache
        if: matrix.language == 'de'
        uses: actions/cache@v5
        with:
          path: .cache/packs/grundwortschatz.db
          key: de-pack-${{ steps.depack.outputs.sha }}

      - name: Fetch the German pack
        if: matrix.language == 'de' && steps.depack-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/packs
          curl -fsSL "${{ steps.depack.outputs.url }}" -o /tmp/de.db.gz
          echo "${{ steps.depack.outputs.sha }}  /tmp/de.db.gz" | sha256sum -c -
          gunzip -c /tmp/de.db.gz > .cache/packs/grundwortschatz.db

      - name: Every item these games can produce
        env:
          WU_CONTRACT_COUNT: '3000'
          WU_CONTRACT_GAMES: ${{ matrix.games }}
          WU_CONTRACT_LANGUAGES: ${{ matrix.language }}
          WU_PACK_DE: ${{ matrix.language == 'de' && format('{0}/.cache/packs/grundwortschatz.db', github.workspace) || '' }}
        run: flutter test --reporter expanded test/audit/challenge_contract_test.dart

  # The provenance oracle asks a different question from the contract: not
  # "is this item well formed" but "did this sentence, gloss or translation
  # come from the pack at all, or did a generator make it up". It was seeded
  # Random(1) in eight places, so it re-checked the same ~3,700 items on every
  # run since it was written. Per push it still does, which is what makes a
  # regression there unmistakable; here it moves.
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Read the German pack pin
        id: depack
        run: |
          python3 - <<'PIN' >> "$GITHUB_OUTPUT"
          import re, pathlib
          source = pathlib.Path('lib/core/models/language_pack.dart').read_text()
          url = re.search(r"remoteUrl:\s*\n?\s*'([^']+)'", source).group(1)
          sha = re.search(r"expectedCompressedSha256:\s*\n?\s*'([0-9a-f]+)'",
                          source).group(1)
          print(f'url={url}')
          print(f'sha={sha}')
          PIN

      - name: Cache the German pack
        id: depack-cache
        uses: actions/cache@v5
        with:
          path: .cache/packs/grundwortschatz.db
          key: de-pack-${{ steps.depack.outputs.sha }}

      - name: Fetch the German pack
        if: steps.depack-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/packs
          curl -fsSL "${{ steps.depack.outputs.url }}" -o /tmp/de.db.gz
          echo "${{ steps.depack.outputs.sha }}  /tmp/de.db.gz" | sha256sum -c -
          gunzip -c /tmp/de.db.gz > .cache/packs/grundwortschatz.db

      - name: Somewhere the oracle has not looked
        env:
          WU_PACK: '1'
          WU_PROVENANCE_SEED: ${{ github.event.inputs.seed || github.run_number }}
          WU_PACK_DE: ${{ github.workspace }}/.cache/packs/grundwortschatz.db
        run: flutter test --reporter expanded test/live/item_provenance_live_test.dart

  # A nightly net nobody looks at is not a net. This one went red and stayed
  # red for a day, and the only reason it was noticed is that somebody asked.
  # A failure now files an issue, and a later green closes it, so the state is
  # visible where the work is rather than in a tab nobody has open.
  report:
    name: Report
    needs: [sweep, exhaustive, provenance]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Open or close the standing issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ (needs.sweep.result == 'success' && needs.exhaustive.result == 'success' && needs.provenance.result == 'success') && 'success' || 'failure' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Content sweep is failing'
          existing=$(gh issue list --state open --search "$title in:title" \
                       --json number --jq '.[0].number // empty')
          if [ "$RESULT" = 'success' ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "The sweep is green again: $RUN"
            fi
            exit 0
          fi
          body="The nightly content sweep failed: $RUN

          Each shard runs the per-push contract over 500 items per game per
          grade, so what it catches is the long tail the 40-item check at
          push time cannot see. Open the failing shard and read the
          \`_Violation\` lines: they name the game, the grade and the rule."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
