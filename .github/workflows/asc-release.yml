# App Store Connect: distribute an uploaded build, and submit a version.
#
# ios-release.yml ends where Apple's copy of the build begins — it uploads and
# stops. Everything after that (letting testers see it, asking for review) is
# App Store Connect API work, which is what this runs.
#
#   submissions  list review submissions and cancel the ones never sent. App
#                Store Connect allows one open submission per platform, so an
#                abandoned one blocks the next release for that platform with
#                an error that does not mention it.
#   status       read the app, its builds, its beta groups and its versions.
#                Changes nothing. Run this first.
#   metadata     what Apple would block a submission on: categories, privacy
#                policy, description, what's new, screenshots per locale, age
#                rating, review contact. Changes nothing, and exits non-zero
#                when something is missing.
#   beta         what external TestFlight would block on, which is not the
#                same list as the App Store: the beta review contact, a beta
#                description and feedback email per locale, and "What to Test"
#                on the build. Internal testing needs none of it.
#   testflight   add a build to the internal and/or external groups, and
#                optionally submit it for beta app review, which external
#                testers cannot install without.
#   appstore     attach a build to a version and optionally submit that version
#                for App Store review.
#
# Uses the same three App Store Connect secrets ios-release.yml already has.
name: App Store Connect

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        type: choice
        options: [status, metadata, submissions, beta, testflight, appstore]
        default: status
      build:
        description: 'Build number (the +N in pubspec version). Blank = read it from pubspec.'
        required: false
      platform:
        description: 'Which platform. iOS and macOS number builds independently.'
        type: choice
        options: [IOS, MAC_OS]
        default: IOS
      cancel_stale:
        description: 'submissions: cancel the review submissions that were never sent'
        type: boolean
        default: false
      version:
        description: 'Marketing version for the appstore action. Blank = read it from pubspec.'
        required: false
      internal:
        description: 'testflight: internal groups'
        type: boolean
        default: true
      external:
        description: 'testflight: external groups'
        type: boolean
        default: false
      submit_beta_review:
        description: 'testflight: submit for beta app review (needed by external testers)'
        type: boolean
        default: false
      submit_for_review:
        description: 'appstore: submit the version to Apple for review'
        type: boolean
        default: false
      whats_new_en:
        description: "appstore: what's new for en-US"
        required: false
      whats_new_de:
        description: "appstore: what's new for de-DE"
        required: false
      what_to_test:
        description: 'testflight: tester-facing note on the build (external testing needs one)'
        required: false

concurrency:
  group: asc-release
  cancel-in-progress: false

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet 'pyjwt[crypto]'

      - name: Read the version out of pubspec
        id: v
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          line=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          echo "version=${IN_VERSION:-${line%%+*}}" >> "$GITHUB_OUTPUT"
          echo "build=${IN_BUILD:-${line##*+}}" >> "$GITHUB_OUTPUT"

      # Every input reaches the script as an environment variable, never as
      # ${{ }} interpolated into the shell. An apostrophe was enough to break
      # the old form: "a child's reading level" inside '...' closed the quote,
      # and the en-US release notes were silently not set while de-DE was. The
      # same pattern is how a text input becomes a command.
      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ACTION: ${{ inputs.action }}
          PLATFORM: ${{ inputs.platform }}
          CANCEL_STALE: ${{ inputs.cancel_stale }}
          BUILD: ${{ steps.v.outputs.build }}
          VERSION: ${{ steps.v.outputs.version }}
          INTERNAL: ${{ inputs.internal }}
          EXTERNAL: ${{ inputs.external }}
          SUBMIT_BETA: ${{ inputs.submit_beta_review }}
          SUBMIT_REVIEW: ${{ inputs.submit_for_review }}
          WHATS_NEW_EN: ${{ inputs.whats_new_en }}
          WHATS_NEW_DE: ${{ inputs.whats_new_de }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          set -euo pipefail
          ASC_API_KEY_P8="$(echo "$P8_B64" | base64 --decode)"
          export ASC_API_KEY_P8
          # Each flag is appended with an `if`, not with `&&`. Under `set -e`
          # a bare `false && args+=(...)` ends the job, so an unticked checkbox
          # would have looked like a failed release.
          case "$ACTION" in
            status)
              python3 tools/release/asc.py status
              ;;
            beta)
              python3 tools/release/asc.py beta --build "$BUILD" \
                --platform "$PLATFORM"
              ;;
            metadata)
              python3 tools/release/asc.py metadata --live \
                --version "$VERSION" --platform "$PLATFORM"
              ;;
            submissions)
              args=()
              [ "$CANCEL_STALE" = 'true' ] && args+=(--cancel-stale) || true
              python3 tools/release/asc.py submissions \
                --platform "$PLATFORM" "${args[@]}"
              ;;
            testflight)
              args=(--build "$BUILD" --platform "$PLATFORM")
              [ "$INTERNAL" = 'true' ] && args+=(--internal) || true
              [ "$EXTERNAL" = 'true' ] && args+=(--external) || true
              [ -n "$WHAT_TO_TEST" ] && \
                args+=(--what-to-test "$WHAT_TO_TEST") || true
              [ "$SUBMIT_BETA" = 'true' ] && \
                args+=(--submit-beta-review) || true
              python3 tools/release/asc.py testflight "${args[@]}"
              ;;
            appstore)
              args=(--build "$BUILD" --version "$VERSION"
                    --platform "$PLATFORM")
              [ -n "$WHATS_NEW_EN" ] && \
                args+=(--whats-new "en-US=$WHATS_NEW_EN") || true
              [ -n "$WHATS_NEW_DE" ] && \
                args+=(--whats-new "de-DE=$WHATS_NEW_DE") || true
              [ "$SUBMIT_REVIEW" = 'true' ] && args+=(--submit) || true
              python3 tools/release/asc.py appstore "${args[@]}"
              ;;
          esac
