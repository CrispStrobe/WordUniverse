name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one run per ref at a time; a newer push cancels the older in-progress
# run so rapid pushes don't create racing production deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Two commits, so the deploy step can ask what actually changed.
          fetch-depth: 2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check deployment parity
        run: node --test tools/deployment-config.test.mjs

      - name: Check the content review tooling
        run: |
          pip install --quiet openai
          python3 tools/audit/review_test.py

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      # The pinned German runtime artifact, so the audit contract can check
      # its 1,500 generated items too — half the games are German-only, and
      # until this ran they were checked nowhere. Keyed on the pin, so a new
      # artifact fetches once and every later run is a cache hit.
      - name: Read the German pack pin
        id: depack
        run: |
          python3 - <<'PIN' >> "$GITHUB_OUTPUT"
          import re, pathlib
          source = pathlib.Path('lib/core/models/language_pack.dart').read_text()
          url = re.search(r"remoteUrl:\s*\n?\s*'([^']+)'", source).group(1)
          sha = re.search(r"expectedCompressedSha256:\s*\n?\s*'([0-9a-f]+)'",
                          source).group(1)
          print(f'url={url}')
          print(f'sha={sha}')
          PIN

      - name: Cache the German pack
        id: depack-cache
        uses: actions/cache@v5
        with:
          path: .cache/packs/grundwortschatz.db
          key: de-pack-${{ steps.depack.outputs.sha }}

      - name: Fetch the German pack
        if: steps.depack-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/packs
          curl -fsSL "${{ steps.depack.outputs.url }}" -o /tmp/de.db.gz
          echo "${{ steps.depack.outputs.sha }}  /tmp/de.db.gz" | sha256sum -c -
          gunzip -c /tmp/de.db.gz > .cache/packs/grundwortschatz.db

      - name: Run tests
        env:
          WU_PACK_DE: ${{ github.workspace }}/.cache/packs/grundwortschatz.db
        run: flutter test --reporter expanded

      # Opt-in suites: the real shipped packs, not fixtures. They open the
      # bundled English artifact and the downloaded German one and check that
      # what the feature index promises the games is what hydration delivers.
      - name: Shipped pack contract
        env:
          WU_PACK: '1'
          WU_PACK_DE: ${{ github.workspace }}/.cache/packs/grundwortschatz.db
        run: flutter test --reporter expanded test/live/shipped_pack_pools_live_test.dart

      # A frozen sample of what the games ask, so a change to the content
      # arrives as a diff someone reads rather than as nothing at all.
      - name: Content golden sample
        env:
          WU_PACK_DE: ${{ github.workspace }}/.cache/packs/grundwortschatz.db
        run: flutter test --reporter expanded test/audit/challenge_golden_test.dart

      # Every string a game shows, back against the pack it came from: a
      # blanked sentence has to put itself together again, a definition
      # prompt has to be a pack gloss with the headword redacted. The app
      # composes almost no English, so this is what there is to check of it.
      - name: Item provenance
        env:
          WU_PACK: '1'
          WU_PACK_DE: ${{ github.workspace }}/.cache/packs/grundwortschatz.db
        run: flutter test --reporter expanded test/live/item_provenance_live_test.dart

      # Every German form the games compose, against the pack's own tables.
      # A structural check cannot tell "du sprichst" from "du sprechst".
      - name: German forms
        env:
          WU_PACK_DE: ${{ github.workspace }}/.cache/packs/grundwortschatz.db
        run: flutter test --reporter expanded test/live/german_forms_live_test.dart

      # `flutter test` skips @TestOn('browser') suites, so the web storage and
      # install path — sqlite3.wasm, the shared worker, IndexedDB, the browser
      # gzip/digest primitives — had no CI coverage at all, despite being what
      # the deployed build actually runs. They need their own invocation.
      - name: Browser tests (web storage and install path)
        run: |
          which google-chrome google-chrome-stable chromium || true
          flutter test --platform chrome test/core/services/db_platform

      - name: Build web
        run: flutter build web --release

      # Deploying every push burned the account's hundred-a-day and left CI
      # red on commits that changed nothing the browser can see. A commit
      # that only touches docs, tests or tools produces the same build, so
      # there is nothing to promote.
      - name: Does this commit change the app?
        id: shipped
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'No usable base commit; deploying.'
            exit 0
          fi
          files="$(git diff --name-only "$before" '${{ github.sha }}')"
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|test/|tools/|\.github/|[^/]*\.md$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Only docs, tests and tooling changed — not deploying.'
          fi

      - name: Install Vercel CLI
        if: steps.shipped.outputs.changed == 'true'
        run: npm install --global vercel@latest

      - name: Deploy
        if: steps.shipped.outputs.changed == 'true'
        working-directory: build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_uvAE8yHK3Zi7pXobhJmwckcQ
          VERCEL_PROJECT_ID: prj_f5CVyUNQuu49kMJxgbxoBwj9xEjS
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set — skipping Vercel deploy."
            echo "Add it under Settings → Secrets and variables → Actions to enable CI deploys."
            exit 0
          fi
          # build/web is already the built output; tell Vercel not to build it.
          node ../../tools/prepare-vercel.mjs vercel.json
          vercel --token "$VERCEL_TOKEN" --prod --yes
