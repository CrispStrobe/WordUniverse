name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Analyze, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build web
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 1

  deploy:
    name: Deploy to Vercel
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy
        working-directory: build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_uvAE8yHK3Zi7pXobhJmwckcQ
          VERCEL_PROJECT_ID: prj_f5CVyUNQuu49kMJxgbxoBwj9xEjS
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set — skipping Vercel deploy."
            echo "Add it under Settings → Secrets and variables → Actions to enable CI deploys."
            exit 0
          fi
          # build/web is already the built output; tell Vercel not to build it.
          cat > vercel.json <<'JSON'
          { "framework": null, "buildCommand": "", "outputDirectory": ".", "ignoreCommand": "exit 0" }
          JSON
          vercel --token "$VERCEL_TOKEN" --prod --yes
