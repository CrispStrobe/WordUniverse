# Rebuilds a language pack artifact from its canonical Hugging Face dataset.
#
# The pipeline is canonical -> slim -> repair -> index -> gzip, and two of
# those steps cannot run on a developer machine that is short of disk: the
# canonical English database is 150 MB to download and index_pack.sh needs the
# Flutter VM. So it runs here, and prints the pin values the registry needs.
#
# It deliberately commits nothing to git. The English artifact is a bundled repo
# asset and its digest selects the storage slot every installed copy reads
# from, so replacing it is a reviewed commit, not a side effect of a build.
#
# It can publish to Hugging Face, which is a different matter and opt-in per run:
#
#   publish_artifact  uploads the German runtime artifact and prints the four
#                     registry pins. English has no artifact here — it is
#                     bundled in the binary.
#   publish_dataset   runs the same repairs against the canonical database and
#                     writes the parquet files back out from it. Without this
#                     every repair lives only in the artifact, so the next
#                     rebuild from the dataset reintroduces all of it.
name: Build a language pack

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Pack to rebuild'
        type: choice
        options: [en, de]
        default: en
      publish_artifact:
        description: 'Upload the runtime artifact to Hugging Face (de only — en ships as a repo asset)'
        type: boolean
        default: false
      publish_dataset:
        description: 'Apply the same repairs to the canonical dataset and its parquet files'
        type: boolean
        default: false

concurrency:
  group: pack-build-${{ inputs.language }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Name the canonical dataset
        id: dataset
        run: |
          case "${{ inputs.language }}" in
            en) repo=cstr/grundwortschatz-voc-en; file=grundwortschatz_en.db.gz;;
            de) repo=cstr/grundwortschatz-voc-de; file=grundwortschatz.db.gz;;
          esac
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Fetch the canonical database
        run: |
          mkdir -p build/pack
          curl -fL --retry 3 -o build/pack/canonical.db.gz \
            "https://huggingface.co/datasets/${{ steps.dataset.outputs.repo }}/resolve/main/${{ steps.dataset.outputs.file }}"
          gunzip -c build/pack/canonical.db.gz > build/pack/canonical.db
          ls -l build/pack/

      - name: Slim, repair and index
        run: |
          set -x
          python3 tools/pack/slim_pack.py build/pack/canonical.db \
            --out build/pack/slim.db
          python3 tools/pack/repair_pack.py build/pack/slim.db \
            --out build/pack/artifact.db
          bash tools/pack/index_pack.sh build/pack/artifact.db

      - name: Install the publishing dependencies
        if: inputs.publish_artifact || inputs.publish_dataset
        run: pip install --quiet huggingface_hub pyarrow

      - name: Compress and pin
        id: pins
        run: |
          gzip -9 -c build/pack/artifact.db > build/pack/artifact.db.gz
          decompressed_sha=$(sha256sum build/pack/artifact.db | cut -d' ' -f1)
          compressed_sha=$(sha256sum build/pack/artifact.db.gz | cut -d' ' -f1)
          decompressed_bytes=$(stat -c%s build/pack/artifact.db)
          compressed_bytes=$(stat -c%s build/pack/artifact.db.gz)
          {
            echo "## Pins for \`${{ inputs.language }}\`"
            echo
            echo '```dart'
            echo "expectedCompressedBytes: $compressed_bytes,"
            echo "expectedCompressedSha256:"
            echo "    '$compressed_sha',"
            echo "expectedDecompressedBytes: $decompressed_bytes,"
            echo "expectedDecompressedSha256:"
            echo "    '$decompressed_sha',"
            echo '```'
            echo
            echo "Append the *previous* qualified name to previousDatabaseNames."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What the repair changed
        run: python3 tools/pack/repair_pack.py build/pack/artifact.db --report

      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ inputs.language }}
          path: build/pack/artifact.db.gz
          retention-days: 7
          compression-level: 0

      # The German pack is downloaded on first launch from an immutable
      # revision, so publishing it is what makes a rebuild reach anybody. The
      # registry still has to be pinned to the commit this prints, in a
      # reviewed commit — the pins are a hard gate in the download transport.
      - name: Publish the runtime artifact
        if: inputs.publish_artifact && inputs.language == 'de'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo '::error::publish_artifact needs the HF_TOKEN secret.'; exit 1
          fi
          cp build/pack/artifact.db.gz build/pack/grundwortschatz-app.db.gz
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          commit = api.upload_file(
              path_or_fileobj='build/pack/grundwortschatz-app.db.gz',
              path_in_repo='grundwortschatz-app.db.gz',
              repo_id='cstr/grundwortschatz-voc-de',
              repo_type='dataset',
              commit_message='Rebuild the runtime artifact',
              commit_description=(
                  'Built by .github/workflows/pack-build.yml from the '
                  'canonical database in this dataset.'),
          )
          print('## Published')
          print()
          print(f'`{commit.oid}`')
          print()
          print('Pin the registry to this revision:')
          print()
          print('```dart')
          print('remoteUrl:')
          print("    'https://huggingface.co/datasets/cstr/"
                f"grundwortschatz-voc-de/resolve/{commit.oid}/"
                "grundwortschatz-app.db.gz',")
          print('```')
          PY

      - name: Publish the repaired canonical dataset
        if: inputs.publish_dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo '::error::publish_dataset needs the HF_TOKEN secret.'; exit 1
          fi
          python3 tools/pack/publish_dataset.py ${{ inputs.language }} \
            --database build/pack/canonical.db \
            --out build/dataset --upload
