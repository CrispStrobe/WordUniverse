# Regenerates the frozen sample of what the games ask.
#
# test/audit/challenge_golden_test.dart fails when a content change makes the
# games ask different questions, which is the point of it — but reading the
# difference means regenerating the file, and that needs the Flutter VM and the
# packs. This produces the new file as an artifact so the diff can be read and
# committed deliberately.
#
#     gh workflow run golden-refresh.yml
#     gh run download <id> -n challenge-golden
name: Refresh the challenge golden

on:
  workflow_dispatch:

concurrency:
  group: golden-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Both goldens or neither. Without the German pack the test skips German
      # and writes only the English file, leaving the German one stale and CI
      # red for a reason the refresh cannot fix. Mirrors the same three steps
      # in ci.yml.
      - name: Read the German pack pin
        id: depack
        run: |
          python3 - <<'PIN' >> "$GITHUB_OUTPUT"
          import re, pathlib
          source = pathlib.Path('lib/core/models/language_pack.dart').read_text()
          url = re.search(r"remoteUrl:\s*\n?\s*'([^']+)'", source).group(1)
          sha = re.search(r"expectedCompressedSha256:\s*\n?\s*'([0-9a-f]+)'",
                          source).group(1)
          print(f'url={url}')
          print(f'sha={sha}')
          PIN

      - name: Cache the German pack
        id: depack-cache
        uses: actions/cache@v5
        with:
          path: .cache/packs/grundwortschatz.db
          key: de-pack-${{ steps.depack.outputs.sha }}

      - name: Fetch the German pack
        if: steps.depack-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/packs
          curl -fsSL "${{ steps.depack.outputs.url }}" -o /tmp/de.db.gz
          echo "${{ steps.depack.outputs.sha }}  /tmp/de.db.gz" | sha256sum -c -
          gunzip -c /tmp/de.db.gz > .cache/packs/grundwortschatz.db

      - name: Regenerate the golden
        env:
          WU_GOLDEN_UPDATE: '1'
          WU_PACK_DE: ${{ github.workspace }}/.cache/packs/grundwortschatz.db
        run: flutter test test/audit/challenge_golden_test.dart

      - name: Show what changed
        run: |
          git --no-pager diff --stat -- test/audit/ || true
          {
            echo '## Golden diff'
            echo '```diff'
            git --no-pager diff -- test/audit/ | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: challenge-golden
          path: test/audit/golden/
          retention-days: 7
