name: GitHub Pages

# Publishes the Flutter web build to https://crispstrobe.github.io/WordUniverse/
#
# Both hosts use the pinned SDK and default CanvasKit renderer (no --wasm).
# Pages cannot configure isolation/cache headers; Vercel matches its JS/WASM
# cache lifetime. See docs/deployment-parity.md for evidence and limitations.
#
# The other Pages-specific detail is --base-href: a project site is served from
# /<repo>/, not /, so asset URLs have to be prefixed or every request 404s.

on:
  push:
    branches: [main]
    # The site is Flutter web: lib, web, assets and the manifests reach it.
    # Nothing else does, and this workflow was the heaviest thing running —
    # 21 runs and 270 wall-minutes, many of them rebuilding the whole app for
    # a commit that touched only docs, a python tool or a test.
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web
        run: |
          set -euo pipefail
          # The trailing slash in base-href is required by Flutter.
          flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Add a 404 that serves the app
        run: |
          # Flutter routes client-side and Pages has no rewrite rule, so a deep
          # link would 404; serving index.html as the 404 page recovers it.
          cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
