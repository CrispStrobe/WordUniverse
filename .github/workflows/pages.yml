name: GitHub Pages

# Publishes the Flutter web build to https://crispstrobe.github.io/WordUniverse/
#
# Deliberately NOT the Vercel build. vercel.json builds with --wasm and sets
# Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy so skwasm can be
# cross-origin isolated. GitHub Pages cannot send either header, so the wasm
# build degrades there; this uses the default renderer, which needs no headers.
#
# The other Pages-specific detail is --base-href: a project site is served from
# /<repo>/, not /, so asset URLs have to be prefixed or every request 404s.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web
        run: |
          set -euo pipefail
          # The trailing slash in base-href is required by Flutter.
          flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Add a 404 that serves the app
        run: |
          # Flutter routes client-side and Pages has no rewrite rule, so a deep
          # link would 404; serving index.html as the 404 page recovers it.
          cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
