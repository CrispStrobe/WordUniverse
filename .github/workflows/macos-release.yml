name: macOS Release (App Store)

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign only, do NOT upload'
        type: boolean
        default: true

env:
  BUNDLE_ID: com.CrispStrobe.wordUniverse
  PROFILE_NAME: WordUniverse MacAppStore CI
  FLUTTER_VERSION: '3.44.2'

jobs:
  build-upload:
    # macos-15 ships Xcode 16.4 by default (macOS 15.5 SDK). The old macos-14
    # image (Xcode 15.4, SDK 14.5) fails to compile in_app_purchase_storekit,
    # which uses the StoreKit2 win-back API (winBackOffers /
    # eligibleWinBackOfferIDs) introduced in the macOS 15 SDK. macos-14 is also
    # deprecated by GitHub (unsupported after 2026-11-02).
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check App Store metadata
        run: python3 tools/test_macos_metadata.py

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Use CocoaPods exclusively
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Setup keychain and certificates
        env:
          P12_B64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PW: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/mac-signing.keychain-db"
          KC_PW="throwaway"
          security create-keychain -p "$KC_PW" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/macdist.p12"
          security import "$RUNNER_TEMP/macdist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KC_PW" "$KC" >/dev/null
            
          echo "== codesigning identities =="
          security find-identity -v -p codesigning "$KC"
          security find-identity -v "$KC" | grep -q "3rd Party Mac Developer Installer" \
            || { echo "::error::MAC_SIGNING_P12_BASE64 has no '3rd Party Mac Developer Installer' identity"; exit 1; }

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' \
            /dev/stdin <<<"$(security cms -D -i "$RUNNER_TEMP/app.provisionprofile")")
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/app.provisionprofile" "$DIR/$UUID.provisionprofile"
          done
          echo "installed profile UUID $UUID"

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" .appstoreconnect
          echo "$P8_B64" | base64 --decode > ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          cp ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"

      - name: Write ExportOptions.plist (manual signing)
        run: |
          cat > .appstoreconnect/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.ASC_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict><key>${{ env.BUNDLE_ID }}</key><string>${{ env.PROFILE_NAME }}</string></dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Build & sign .pkg
        run: |
          set -euo pipefail
          PATH="/usr/bin:$PATH" flutter build macos --release --config-only
          PATH="/usr/bin:$PATH" env -u GEM_HOME -u GEM_PATH -u RUBYOPT \
            pod install --project-directory=macos || echo "No podfile, skipping pod install"
          
          export ASC_TEAM_ID="${{ secrets.ASC_TEAM_ID }}"
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('macos/Runner.xcodeproj')
            project.targets.each do |target|
              next unless target.name == 'Runner'
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
                config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_NAME']
                config.build_settings['DEVELOPMENT_TEAM'] = ENV['ASC_TEAM_ID']
              end
            end
            project.save
          "
          PATH="/usr/bin:$PATH" xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath build/macos/archive/Runner.xcarchive \
            clean archive
          
          # Check for app-sandbox
          APP=build/macos/archive/Runner.xcarchive/Products/Applications/word_universe.app
          codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | plutil -convert xml1 -o - - | grep -q 'app-sandbox' \
            || { echo "::error::the archived .app has no app-sandbox entitlement"; exit 1; }
            
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath build/macos/archive/Runner.xcarchive \
            -exportPath build/macos/pkg \
            -exportOptionsPlist .appstoreconnect/ExportOptions.plist
            
          PKG=$(ls build/macos/pkg/*.pkg | head -1)
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: build/macos/pkg/*.pkg
          if-no-files-found: error

      - name: Validate with App Store Connect
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          xcrun altool --validate-app -f "$PKG" --type macos \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          xcrun altool --upload-package "$PKG" --type macos \
            --apple-id "${{ secrets.ASC_APP_ID }}" \
            --bundle-id "${{ env.BUNDLE_ID }}" \
            --bundle-version "$BUILD" \
            --bundle-short-version-string "$VER" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"
